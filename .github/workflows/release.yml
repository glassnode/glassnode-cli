name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/glassnode/glassnode-api-go-client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Authenticate private SDK dependency
        env:
          GH_TOKEN: ${{ secrets.GLASSNODE_SDK_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GLASSNODE_SDK_READ_TOKEN must grant read access to glassnode/glassnode-api-go-client."
            exit 1
          fi
          gh auth setup-git
          go mod download

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GLASSNODE_SDK_READ_TOKEN }}
