<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed in — Glassnode</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background: #fff;
      border-radius: 8px;
      padding: 40px 32px;
      max-width: 400px;
      width: calc(100% - 32px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    }

    .logo {
      width: 150px;
      display: block;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #e5e5e5;
    }

    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid #000;
    }

    .icon svg {
      width: 22px;
      height: 22px;
      stroke: #000;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #000;
    }

    p {
      font-size: 13px;
      line-height: 1.6;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://static.glassnode.com/auth/logo.svg" alt="Glassnode" onerror="this.style.display='none'">
    <div class="divider"></div>
    <div class="icon">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="text">
      <h1>You're signed in</h1>
      <p>You can now start using the Glassnode CLI.<br>This window can be closed.</p>
    </div>
  </div>
</body>
</html>
